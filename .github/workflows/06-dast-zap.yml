# ============================================
# WORKFLOW: Stage 6 - OWASP ZAP DAST Scan
# ============================================

name: "Stage 6: OWASP ZAP DAST Scan"

on:
  workflow_run:
    workflows: ["Stage 5: Deploy to DMZ"]
    types: [completed]
  workflow_dispatch:

jobs:
  zap-scan:
    name: "🕷️ OWASP ZAP Security Scan"
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      # ─────────────────────────────────────
      # STEP 1: Checkout Repository
      # ─────────────────────────────────────
      - name: "Step 1️⃣: Checkout Repository"
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # STEP 2: Récupérer l'URL cible depuis Vault
      # ─────────────────────────────────────
      - name: "Step 2️⃣: Get DVWA URL from Vault"
        run: |
          export VAULT_ADDR="${{ secrets.VAULT_ADDR2 }}"
          export VAULT_TOKEN="${{ secrets.VAULT_TOKEN2 }}"
          
          get_secret() {
            vault kv get -format=json "$1" 2>/dev/null | jq -r ".data.data.$2 // empty"
          }
          
          DMZ_HOST=$(get_secret "secret/data/devsecops/remediation" "dmz_host")
          echo "DVWA_URL=http://$DMZ_HOST:80" >> $GITHUB_ENV
          echo "DMZ_HOST=$DMZ_HOST" >> $GITHUB_ENV
          echo "🎯 Target URL: http://$DMZ_HOST:80"
        shell: bash

      # ─────────────────────────────────────
      # STEP 3: Attendre que DVWA soit prêt
      # ─────────────────────────────────────
      - name: "Step 3️⃣: Wait for DVWA to be Ready"
        run: |
          echo "⏳ Waiting for DVWA to be ready..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -sf --max-time 5 $DVWA_URL > /dev/null 2>&1; then
              echo "✅ DVWA is ready!"
              break
            fi
            attempt=$((attempt + 1))
            echo "⏱️  Attempt $attempt/$max_attempts - Waiting 10s..."
            sleep 10
          done
          if [ $attempt -eq $max_attempts ]; then
            echo "❌ DVWA is not responding after $max_attempts attempts"
            exit 1
          fi
        shell: bash

      # ─────────────────────────────────────
      # STEP 4: OWASP ZAP Baseline Scan (CORRIGÉ)
      # ─────────────────────────────────────
      - name: "Step 4️⃣: OWASP ZAP Baseline Scan"
        run: |
          echo "🕷️ Starting OWASP ZAP Baseline Scan..."
          echo "🎯 Target: $DVWA_URL"
          
          mkdir -p zap-reports
          
          # ✅ Commande corrigée :
          # • -I : Ignorer les warnings dans l'exit code
          # • -a : Mode autonome
          # • -r/-J/-x : Formats de rapport
          # • || true : Ne pas échouer si ZAP retourne code != 0
          docker run --rm \
            -v $(pwd)/zap-reports:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t $DVWA_URL \
            -r zap_report.html \
            -J zap_report.json \
            -x zap_report.xml \
            -I \
            -a \
            || true  # ✅ Permet de continuer même avec des WARN/FAIL
          
          # Vérifier que les rapports existent
          if [ -f zap-reports/zap_report.html ]; then
            echo "✅ ZAP Baseline Scan completed - Reports generated"
            ls -la zap-reports/
          else
            echo "⚠️  Reports may not have been generated"
            ls -la zap-reports/ || true
          fi
        shell: bash

      # ─────────────────────────────────────
      # STEP 5: Full Scan (Optionnel - CORRIGÉ)
      # ─────────────────────────────────────
      - name: "Step 5️⃣: OWASP ZAP Full Scan (Optional)"
        run: |
          echo "🕷️ Starting OWASP ZAP Full Scan..."
          mkdir -p zap-reports-full
          
          docker run --rm \
            -v $(pwd)/zap-reports-full:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py \
            -t $DVWA_URL \
            -r zap_full_report.html \
            -J zap_full_report.json \
            -x zap_full_report.xml \
            -a \
            || true  # ✅ Continue même avec des vulnérabilités trouvées
          
          echo "✅ ZAP Full Scan completed (or skipped)"
        continue-on-error: true
        shell: bash

      # ─────────────────────────────────────
      # STEP 6: Résumé des vulnérabilités
      # ─────────────────────────────────────
      - name: "Step 6️⃣: Vulnerability Summary"
        run: |
          echo "📊 OWASP ZAP Scan Results"
          echo "========================="
          echo ""
          
          if [ -f zap-reports/zap_report.json ]; then
            echo "📁 Baseline Scan Results:"
            echo ""
            
            # Compter les alertes par niveau (riskcode: 3=High, 2=Medium, 1=Low, 0=Info)
            HIGH=$(cat zap-reports/zap_report.json | jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' 2>/dev/null || echo "0")
            MEDIUM=$(cat zap-reports/zap_report.json | jq '[.site[]?.alerts[]? | select(.riskcode=="2")] | length' 2>/dev/null || echo "0")
            LOW=$(cat zap-reports/zap_report.json | jq '[.site[]?.alerts[]? | select(.riskcode=="1")] | length' 2>/dev/null || echo "0")
            INFO=$(cat zap-reports/zap_report.json | jq '[.site[]?.alerts[]? | select(.riskcode=="0")] | length' 2>/dev/null || echo "0")
            
            echo "🔴 High Risk: $HIGH"
            echo "🟠 Medium Risk: $MEDIUM"
            echo "🟡 Low Risk: $LOW"
            echo "🔵 Informational: $INFO"
            echo ""
            
            # Afficher les vulnérabilités HIGH si présentes
            if [ "$HIGH" -gt 0 ]; then
              echo "⚠️  HIGH RISK VULNERABILITIES:"
              cat zap-reports/zap_report.json | jq -r '.site[]?.alerts[]? | select(.riskcode=="3") | "  • \(.alert)"' 2>/dev/null || true
              echo ""
            fi
          else
            echo "⚠️  No JSON report found - checking HTML report..."
            if [ -f zap-reports/zap_report.html ]; then
              echo "✅ HTML report exists: zap-reports/zap_report.html"
            else
              echo "❌ No reports found"
            fi
          fi
        shell: bash

      # ─────────────────────────────────────
      # STEP 7: Upload des rapports
      # ─────────────────────────────────────
      - name: "Step 7️⃣: Upload ZAP Reports"
        uses: actions/upload-artifact@v4
        with:
          name: zap-security-reports
          path: |
            zap-reports/*.html
            zap-reports/*.json
            zap-reports/*.xml
            zap-reports-full/*.html
            zap-reports-full/*.json
            zap-reports-full/*.xml
          retention-days: 30
          if-no-files-found: warn

      # ─────────────────────────────────────
      # STEP 8: Résumé GitHub
      # ─────────────────────────────────────
      - name: "Step 8️⃣: Create Summary"
        run: |
          echo "## 🕷️ OWASP ZAP Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Target**: $DVWA_URL" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Date**: $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f zap-reports/zap_report.json ]; then
            HIGH=$(cat zap-reports/zap_report.json | jq '[.site[]?.alerts[]? | select(.riskcode=="3")] | length' 2>/dev/null || echo "0")
            MEDIUM=$(cat zap-reports/zap_report.json | jq '[.site[]?.alerts[]? | select(.riskcode=="2")] | length' 2>/dev/null || echo "0")
            LOW=$(cat zap-reports/zap_report.json | jq '[.site[]?.alerts[]? | select(.riskcode=="1")] | length' 2>/dev/null || echo "0")
            
            echo "### 📊 Results" >> $GITHUB_STEP_SUMMARY
            echo "- 🔴 High Risk: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- 🟠 Medium Risk: $MEDIUM" >> $GITHUB_STEP_SUMMARY
            echo "- 🟡 Low Risk: $LOW" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$HIGH" -gt 0 ]; then
              echo "⚠️ **Note**: DVWA is intentionally vulnerable - these findings are expected!" >> $GITHUB_STEP_SUMMARY
            else
              echo "✅ No high-risk vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "⚠️ Report parsing skipped - check artifacts for raw reports" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Reports" >> $GITHUB_STEP_SUMMARY
          echo "- Download reports from 'Artifacts' section (retention: 30 days)" >> $GITHUB_STEP_SUMMARY
        shell: bash
