# ============================================
# WORKFLOW: Stage 5 - Deploy to DMZ (DEBUG)
# ============================================

name: "Stage 5: Deploy to DMZ"

on:
  workflow_run:
    workflows: ["Stage 4: Security Scan - Trivy"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-dmz:
    name: "🚀 Deploy to DMZ"
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      # ─────────────────────────────────────
      # STEP 1: Checkout
      # ─────────────────────────────────────
      - name: "Step 1️⃣: Checkout Repository"
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # STEP 2: DIAGNOSTIC VAULT
      # ─────────────────────────────────────
      - name: "Step 2️⃣: DEBUG Vault Connection"
        run: |
          echo "=== 🕵️♂️ DÉBUT DU DIAGNOSTIC VAULT ==="
          
          # 1. Vérifier que les secrets GitHub existent
          echo "1. Vérification des Secrets GitHub :"
          if [ -z "${{ secrets.VAULT_ADDR2 }}" ]; then echo "❌ VAULT_ADDR2 est VIDE"; else echo "✅ VAULT_ADDR2 est défini"; fi
          if [ -z "${{ secrets.VAULT_TOKEN2 }}" ]; then echo "❌ VAULT_TOKEN2 est VIDE"; else echo "✅ VAULT_TOKEN2 est défini"; fi
          
          # 2. Installer jq si manquant
          which jq || (echo "Installation de jq..." && sudo apt-get update && sudo apt-get install -y jq)
          
          # 3. Tester la connectivité vers Vault
          echo "2. Test de connectivité vers : ${{ secrets.VAULT_ADDR2 }}"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.VAULT_ADDR2 }}/v1/sys/health")
          echo "Code HTTP Santé Vault : $HTTP_CODE"
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ ÉCHEC : Impossible de contacter Vault."
            echo "💡 SOLUTION : Vérifiez que VAULT_ADDR2 utilise l'IP LAN (ex: http://192.168.40.100:8200) et non 127.0.0.1"
          fi
          
          # 4. Tenter de lire le secret
          echo "3. Tentative de lecture du secret..."
          RESPONSE=$(curl -s -H "X-Vault-Token: ${{ secrets.VAULT_TOKEN2 }}" "${{ secrets.VAULT_ADDR2 }}/v1/secret/data/devsecops/remediation")
          echo "Réponse brute (masquée partiellement) : ${RESPONSE:0:100}..."
          
          # Extraire un champ test
          DMZ_HOST=$(echo "$RESPONSE" | jq -r '.data.data.dmz_host // empty')
          
          if [ -z "$DMZ_HOST" ]; then
            echo "❌ ÉCHEC : Le secret n'a pas pu être lu ou est vide."
            echo "💡 VÉRIFIEZ : Le Token est-il correct ? Le chemin 'secret/data/...' est-il bon ?"
            # On ne fait pas exit 1 ici pour voir la suite, mais le job échouera plus loin
          else
            echo "✅ SUCCÈS : Secret lu ! DMZ_HOST = $DMZ_HOST"
          fi
          
          echo "=== 🕵️‍♂️ FIN DU DIAGNOSTIC ==="
        shell: bash

      # ─────────────────────────────────────
      # STEP 3: Configurer SSH
      # ─────────────────────────────────────
      - name: "Step 3️⃣: Setup SSH Key"
        run: |
          # Note: Ce step échouera car les variables ne sont pas exportées dans le mode DEBUG
          echo "⚠️ Ce step est désactivé en mode DEBUG."
        shell: bash

      # ─────────────────────────────────────
      # STEP 4: Déployer sur DMZ
      # ─────────────────────────────────────
      - name: "Step 4️⃣: Deploy Application"
        run: echo "⚠️ Déploiement désactivé en mode DEBUG."

      # ─────────────────────────────────────
      # STEP 5: Vérifier
      # ─────────────────────────────────────
      - name: "Step 5️⃣: Verify"
        run: echo "⚠️ Vérification désactivée en mode DEBUG."

      # ─────────────────────────────────────
      # STEP 6: Résumé
      # ─────────────────────────────────────
      - name: "Step 6️⃣: Summary"
        run: echo "Diagnostic terminé."
