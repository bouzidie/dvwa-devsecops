# ============================================
# WORKFLOW: Stage 5 - Deploy to DMZ
# ============================================

name: "Stage 5: Deploy to DMZ"

on:
  workflow_run:
    workflows: ["Stage 4: Security Scan - Trivy"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-dmz:
    name: "🚀 Deploy to DMZ"
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      # ─────────────────────────────────────
      # STEP 1: Checkout Repository
      # ─────────────────────────────────────
      - name: "Step 1️⃣: Checkout Repository"
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # STEP 2: Récupérer credentials via API Vault (KV v2)
      # ─────────────────────────────────────
      - name: "Step 2️⃣: Get Credentials from Vault"
        run: |
          VAULT_ADDR="${{ secrets.VAULT_ADDR2 }}"
          VAULT_TOKEN="${{ secrets.VAULT_TOKEN2 }}"
          
          # Fonction pour extraire un champ (format KV v2)
          get_vault() {
            curl -s -H "X-Vault-Token: $VAULT_TOKEN" \
              "$VAULT_ADDR/v1/$1" | jq -r ".data.data.$2 // empty"
          }
          
          # Charger les secrets dans GitHub Actions Environment
          echo "DMZ_HOST=$(get_vault 'secret/data/devsecops/remediation' 'dmz_host')" >> $GITHUB_ENV
          echo "DMZ_USER=$(get_vault 'secret/data/devsecops/remediation' 'dmz_user')" >> $GITHUB_ENV
          echo "DMZ_DEPLOY_PATH=$(get_vault 'secret/data/devsecops/remediation' 'dmz_deploy_path')" >> $GITHUB_ENV
          echo "GHCR_USERNAME=$(get_vault 'secret/data/devsecops/registry' 'ghcr_username')" >> $GITHUB_ENV
          echo "GHCR_TOKEN=$(get_vault 'secret/data/devsecops/registry' 'ghcr_token')" >> $GITHUB_ENV
          
          # Clé SSH (gestion multiligne propre pour $GITHUB_ENV)
          SSH_KEY=$(get_vault 'secret/data/devsecops/remediation' 'ssh_deploy_key')
          echo "SSH_DEPLOY_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Vérification rapide
          if [[ -z "$DMZ_HOST" || -z "$GHCR_TOKEN" || -z "$SSH_KEY" ]]; then
            echo "❌ Échec: Secrets non récupérés depuis Vault"
            exit 1
          fi
          echo "✅ Secrets chargés avec succès depuis Vault"
        shell: bash

      # ─────────────────────────────────────
      # STEP 3: Configurer SSH
      # ─────────────────────────────────────
      - name: "Step 3️⃣: Setup SSH Key"
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/dvwa-deploy-key
          chmod 600 ~/.ssh/dvwa-deploy-key
          ssh-keyscan $DMZ_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "✅ SSH key configured"

      # ─────────────────────────────────────
      # STEP 4: Déployer sur DMZ (Méthode robuste)
      # ─────────────────────────────────────
      - name: "Step 4️⃣: Deploy Application to DMZ"
        run: |
          echo "🚀 Deploying to $DMZ_USER@$DMZ_HOST..."
          
          # Exécution distante sécurisée avec passage de paramètres
          ssh -i ~/.ssh/dvwa-deploy-key $DMZ_USER@$DMZ_HOST bash -s \
            "$DMZ_DEPLOY_PATH" "$GHCR_TOKEN" "$GHCR_USERNAME" "$GITHUB_REPOSITORY_OWNER" << 'ENDSSH'
            set -e
            DEPLOY_PATH="$1"
            TOKEN="$2"
            USER="$3"
            REPO_OWNER="$4"
            
            cd "$DEPLOY_PATH"
            
            # Login GHCR
            echo "$TOKEN" | docker login ghcr.io -u "$USER" --password-stdin
            
            # Stop old container
            docker stop dvwa-app 2>/dev/null || true
            docker rm dvwa-app 2>/dev/null || true
            
            # Pull latest image
            docker pull ghcr.io/$REPO_OWNER/dvwa-devsecops:latest
            
            # Start new container
            docker compose up -d
            
            # Wait for health
            echo "⏳ Waiting for application..."
            sleep 15
            
            # Verify
            if curl -sf http://localhost:80 > /dev/null; then
              echo "✅ Deployment successful!"
            else
              echo "❌ Deployment failed!"
              exit 1
            fi
          ENDSSH
        env:
          GHCR_USERNAME: ${{ env.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ env.GHCR_TOKEN }}
          DMZ_DEPLOY_PATH: ${{ env.DMZ_DEPLOY_PATH }}

      # ─────────────────────────────────────
      # STEP 5: Vérifier le déploiement
      # ─────────────────────────────────────
      - name: "Step 5️⃣: Verify Deployment"
        run: |
          echo "🔍 Verifying deployment..."
          HTTP_STATUS=$(ssh -i ~/.ssh/dvwa-deploy-key $DMZ_USER@$DMZ_HOST \
            "curl -s -o /dev/null -w '%{http_code}' http://localhost:80")
          
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Application is responding!"
          else
            echo "⚠️ Application status: $HTTP_STATUS"
          fi

      # ─────────────────────────────────────
      # STEP 6: Résumé
      # ─────────────────────────────────────
      - name: "Step 6️⃣: Deployment Summary"
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ DVWA deployed to DMZ" >> $GITHUB_STEP_SUMMARY
          echo "📍 Host: $DMZ_HOST" >> $GITHUB_STEP_SUMMARY
          echo "🌐 URL: http://$DMZ_HOST:80" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Next: OWASP ZAP DAST Scan" >> $GITHUB_STEP_SUMMARY
