# ============================================
# WORKFLOW: Stage 5 - Deploy to DMZ
# ============================================

name: "Stage 5: Deploy to DMZ"

on:
  workflow_run:
    workflows: ["Stage 4: Security Scan - Trivy"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-dmz:
    name: "🚀 Deploy to DMZ"
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      # ─────────────────────────────────────
      # STEP 1: Checkout Repository
      # ─────────────────────────────────────
      - name: "Step 1️⃣: Checkout Repository"
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # STEP 2: Récupérer credentials via Vault CLI
      # ─────────────────────────────────────
      - name: "Step 2️⃣: Get Credentials via Vault CLI"
        run: |
          # Configurer l'environnement pour la CLI Vault
          export VAULT_ADDR="${{ secrets.VAULT_ADDR2 }}"
          export VAULT_TOKEN="${{ secrets.VAULT_TOKEN2 }}"
          
          echo "🔐 Loading secrets from Vault via CLI..."
          
          # Fonction pour lire un champ d'un secret (KV v2)
          get_secret() {
            vault kv get -format=json "$1" 2>/dev/null | jq -r ".data.data.$2 // empty"
          }
          
          # Lire les secrets remediation
          DMZ_HOST=$(get_secret "secret/data/devsecops/remediation" "dmz_host")
          DMZ_USER=$(get_secret "secret/data/devsecops/remediation" "dmz_user")
          DMZ_DEPLOY_PATH=$(get_secret "secret/data/devsecops/remediation" "dmz_deploy_path")
          SSH_DEPLOY_KEY=$(get_secret "secret/data/devsecops/remediation" "ssh_deploy_key")
          
          # Lire les secrets registry
          GHCR_USERNAME=$(get_secret "secret/data/devsecops/registry" "ghcr_username")
          GHCR_TOKEN=$(get_secret "secret/data/devsecops/registry" "ghcr_token")
          
          # Exporter dans GitHub Actions Environment (persistant entre les steps)
          echo "DMZ_HOST=$DMZ_HOST" >> $GITHUB_ENV
          echo "DMZ_USER=$DMZ_USER" >> $GITHUB_ENV
          echo "DMZ_DEPLOY_PATH=$DMZ_DEPLOY_PATH" >> $GITHUB_ENV
          echo "GHCR_USERNAME=$GHCR_USERNAME" >> $GITHUB_ENV
          echo "GHCR_TOKEN=$GHCR_TOKEN" >> $GITHUB_ENV
          
          # Clé SSH (gestion multiligne propre)
          echo "SSH_DEPLOY_KEY<<EOF" >> $GITHUB_ENV
          echo "$SSH_DEPLOY_KEY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Vérification
          echo "📊 Loaded values:"
          echo "   DMZ_HOST: $DMZ_HOST"
          echo "   DMZ_USER: $DMZ_USER"
          echo "   GHCR_USERNAME: $GHCR_USERNAME"
          echo "   SSH_KEY length: ${#SSH_DEPLOY_KEY} chars"
          
          if [[ -z "$DMZ_HOST" || -z "$GHCR_TOKEN" || -z "$SSH_DEPLOY_KEY" ]]; then
            echo "❌ ERROR: Failed to load one or more secrets from Vault"
            echo "💡 Debug: Run 'vault kv get secret/data/devsecops/remediation' manually"
            exit 1
          fi
          
          echo "✅ All secrets loaded successfully via Vault CLI"
        shell: bash

      # ─────────────────────────────────────
      # STEP 3: Configurer SSH
      # ─────────────────────────────────────
      - name: "Step 3️⃣: Setup SSH Key"
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_DEPLOY_KEY" > ~/.ssh/dvwa-deploy-key
          chmod 600 ~/.ssh/dvwa-deploy-key
          ssh-keyscan $DMZ_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "✅ SSH key configured for $DMZ_HOST"

      # ─────────────────────────────────────
      # STEP 4: Déployer sur DMZ (Via Administrator - PAS besoin d'Internet DMZ)
      # ─────────────────────────────────────
      - name: "Step 4️⃣: Deploy Application to DMZ (via Administrator)"
        run: |
          echo "🚀 Deploying to $DMZ_USER@$DMZ_HOST..."
          
          # 1. Login GHCR sur Administrator (runner)
          echo "🔐 Logging to GHCR on Administrator..."
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          
          # 2. Pull l'image sur Administrator
          echo "📦 Pulling image on Administrator..."
          docker pull ghcr.io/$GITHUB_REPOSITORY_OWNER/dvwa-devsecops:latest
          
          # 3. Sauvegarder l'image dans un fichier tar
          echo "💾 Saving image to tar file..."
          docker save ghcr.io/$GITHUB_REPOSITORY_OWNER/dvwa-devsecops:latest -o /tmp/dvwa-image.tar
          
          # 4. Copier le fichier sur la DMZ via SCP (utilise SSH qui fonctionne)
          echo "📤 Copying image to DMZ via SCP..."
          scp -i ~/.ssh/dvwa-deploy-key -o StrictHostKeyChecking=no \
            /tmp/dvwa-image.tar $DMZ_USER@$DMZ_HOST:/tmp/dvwa-image.tar
          
          # 5. Charger et déployer sur la DMZ
          echo "🔧 Loading and deploying on DMZ..."
          ssh -i ~/.ssh/dvwa-deploy-key -o StrictHostKeyChecking=no $DMZ_USER@$DMZ_HOST bash -s "$DMZ_DEPLOY_PATH" << 'ENDSSH'
            set -e
            DEPLOY_PATH="$1"
            
            cd "$DEPLOY_PATH"
            
            # Charger l'image depuis le fichier tar
            echo "📦 Loading image from tar..."
            docker load -i /tmp/dvwa-image.tar
            
            # Stop old container if exists
            echo "🛑 Stopping old container..."
            docker stop dvwa-app 2>/dev/null || true
            docker rm dvwa-app 2>/dev/null || true
            
            # Start new container with docker-compose
            echo "🚀 Starting new container..."
            docker compose up -d
            
            # Cleanup tar file
            rm -f /tmp/dvwa-image.tar
            
            # Wait for application to be ready
            echo "⏳ Waiting for application health check..."
            sleep 20
            
            # Verify deployment
            echo "🔍 Verifying deployment..."
            if curl -sf --max-time 10 http://localhost:80 > /dev/null; then
              echo "✅ Deployment successful! DVWA is running on port 80."
            else
              echo "❌ Deployment failed! Application not responding on port 80."
              echo "📋 Docker logs:"
              docker logs dvwa-app --tail 30
              exit 1
            fi
          ENDSSH
          
          # Cleanup local tar file
          rm -f /tmp/dvwa-image.tar
          echo "✅ Deployment pipeline completed!"
        env:
          GHCR_USERNAME: ${{ env.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ env.GHCR_TOKEN }}
          DMZ_DEPLOY_PATH: ${{ env.DMZ_DEPLOY_PATH }}

      # ─────────────────────────────────────
      # STEP 5: Vérifier le déploiement
      # ─────────────────────────────────────
      - name: "Step 5️⃣: Verify Deployment"
        run: |
          echo "🔍 Final verification..."
          HTTP_STATUS=$(ssh -i ~/.ssh/dvwa-deploy-key $DMZ_USER@$DMZ_HOST \
            "curl -s -o /dev/null -w '%{http_code}' http://localhost:80")
          
          echo "📊 HTTP Status: $HTTP_STATUS"
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Application is responding correctly!"
          else
            echo "⚠️ Application returned status: $HTTP_STATUS"
          fi

      # ─────────────────────────────────────
      # STEP 6: Résumé
      # ─────────────────────────────────────
      - name: "Step 6️⃣: Deployment Summary"
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ DVWA deployed to DMZ" >> $GITHUB_STEP_SUMMARY
          echo "📍 Host: \`$DMZ_HOST\`" >> $GITHUB_STEP_SUMMARY
          echo "🌐 URL: [http://$DMZ_HOST:80](http://$DMZ_HOST:80)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Next: OWASP ZAP DAST Scan (Stage 6)" >> $GITHUB_STEP_SUMMARY
