# ============================================
# WORKFLOW: Stage 5 - Deploy to DMZ (DEBUG ULTIME)
# ============================================

name: "Stage 5: Deploy to DMZ"

on:
  workflow_run:
    workflows: ["Stage 4: Security Scan - Trivy"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy-dmz:
    name: "🚀 Deploy to DMZ"
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      # ─────────────────────────────────────
      # STEP 1: Checkout
      # ─────────────────────────────────────
      - name: "Step 1️⃣: Checkout Repository"
        uses: actions/checkout@v4

      # ─────────────────────────────────────
      # STEP 2: DEBUG ULTIME - Explorer Vault
      # ─────────────────────────────────────
      - name: "Step 2️⃣: ULTIMATE Vault Debug"
        run: |
          echo "=== 🔍 ULTIMATE VAULT DEBUG ==="
          echo ""
          
          # Variables
          VAULT_ADDR="${{ secrets.VAULT_ADDR2 }}"
          VAULT_TOKEN="${{ secrets.VAULT_TOKEN2 }}"
          
          echo "📍 Vault Address: $VAULT_ADDR"
          echo "🔑 Token (first 10 chars): ${VAULT_TOKEN:0:10}..."
          echo ""
          
          # 1. Health check
          echo "1️⃣ Health Check:"
          curl -s -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/sys/health" | jq .
          echo ""
          
          # 2. Token lookup (voir les policies)
          echo "2️⃣ Token Info (policies):"
          curl -s -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/auth/token/lookup-self" | jq '.data.policies'
          echo ""
          
          # 3. Lister le contenu de secret/
          echo "3️⃣ Listing secret/ (KV v2 list API):"
          curl -s -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/?list=true" | jq .
          echo ""
          
          # 4. Tenter différents chemins pour le secret
          echo "4️⃣ Testing different paths for remediation secret:"
          
          echo "   a) secret/data/devsecops/remediation (KV v2 standard):"
          curl -s -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/devsecops/remediation" | jq '{errors: .errors, has_data: (.data.data != null)}'
          
          echo "   b) secret/devsecops/remediation (KV v1 style):"
          curl -s -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/devsecops/remediation" | jq '{errors: .errors, has_data: (.data != null)}'
          
          echo "   c) secret/data/remediation (sans sous-dossier):"
          curl -s -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/remediation" | jq '{errors: .errors, has_data: (.data.data != null)}'
          echo ""
          
          # 5. Vérifier les secrets registry aussi
          echo "5️⃣ Testing registry secret:"
          curl -s -H "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/secret/data/devsecops/registry" | jq '{errors: .errors, has_data: (.data.data != null)}'
          echo ""
          
          # 6. Résumé
          echo "=== 📊 RÉSUMÉ ==="
          echo "Si vous voyez 'has_data: true' pour un chemin → utilisez ce chemin dans le workflow"
          echo "Si toutes les réponses ont 'errors: []' → le token n'a pas accès ou les secrets n'existent pas"
          echo ""
          echo "💡 Pour corriger :"
          echo "   1. Vérifiez que les secrets existent : vault kv list secret/data/devsecops/"
          echo "   2. Vérifiez les policies du token : vault token lookup myroot"
          echo "   3. Si besoin, recréez les secrets avec le bon chemin"
        shell: bash

      # ─────────────────────────────────────
      # STEPS 3-6: Désactivés pour le debug
      # ─────────────────────────────────────
      - name: "Step 3️⃣: Setup SSH (disabled)"
        run: echo "⏸️ Disabled for debug"
      
      - name: "Step 4️⃣: Deploy (disabled)"
        run: echo "⏸️ Disabled for debug"
      
      - name: "Step 5️⃣: Verify (disabled)"
        run: echo "⏸️ Disabled for debug"
      
      - name: "Step 6️⃣: Summary"
        run: |
          echo "## 🔍 Debug Complete" >> $GITHUB_STEP_SUMMARY
          echo "Voir les logs du Step 2 pour le diagnostic." >> $GITHUB_STEP_SUMMARY
